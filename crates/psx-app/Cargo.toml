[package]
name = "psx-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native PS1e frontend: egui debug shell on wgpu"

# The executable is `ps1e`; the crate keeps its workspace name.
# `psxctl` in src/bin/ is still auto-discovered alongside this.
[[bin]]
name = "ps1e"
path = "src/main.rs"

[dependencies]
psx-core = { path = "../psx-core" }
psx-debug = { path = "../psx-debug" }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# default features off: drops the glow (OpenGL) renderer and accesskit,
# and lets us pick wgpu backends explicitly below.
# "wgpu_no_default_features" rather than "wgpu": the latter also enables
# egui-wgpu/default, which pulls wgpu/default -- every backend on every
# platform -- and cargo's additive features leave no way to subtract it.
eframe = { version = "0.36", default-features = false, features = [
    "wgpu_no_default_features",
    "default_fonts",
    "wayland", # Linux targets only; no cost on Windows
    "x11",     # Linux targets only; no cost on Windows
] }
cpal = "0.18"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
gilrs = "0.11.2"
rfd = "0.17.2"
png = "0.18"

# One native wgpu backend per OS keeps naga's shader translators to a single
# target language. Excludes gles/webgpu everywhere.
[target.'cfg(windows)'.dependencies]
wgpu = { version = "30", default-features = false, features = ["dx12", "std", "wgsl"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["vulkan", "std", "wgsl"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["metal", "std", "wgsl"] }
