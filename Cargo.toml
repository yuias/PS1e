[workspace]
resolver = "3"
members = ["crates/psx-core", "crates/psx-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tracing = "0.1"

# Emulator hot loops benefit heavily from optimization even while debugging.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true # "thin"
codegen-units = 1
strip = true
panic = "abort"

# Size-optimize dependencies only; workspace members keep opt-level 3
# so emulator hot loops are unaffected.
[profile.release.package."*"]
opt-level = "s"
